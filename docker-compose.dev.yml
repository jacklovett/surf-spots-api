# Development Docker Compose
#
# Default (recommended): Postgres + Mailpit only.
#   docker compose -f docker-compose.dev.yml up -d
#   ./mvnw spring-boot:run
#   (Windows PowerShell: .\mvnw.cmd spring-boot:run)
#
# Optional: API inside Docker too (slower edit loop; no reliable src→target watch on Windows mounts):
#   docker compose -f docker-compose.dev.yml --profile docker-api up --build
services:
  postgres:
    image: postgres:16
    container_name: surf-spots-postgres-dev
    # Default max_connections (100) is easy to hit if the host shares this DB (IDE, API container,
    # tests, scripts). Raise for local dev; restart the container after changing.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: surf_spots_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - surf-spots-network

  # SMTP sink + web UI to inspect real sent messages (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:latest
    container_name: surf-spots-mailpit-dev
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - surf-spots-network

  api:
    profiles: ["docker-api"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: surf-spots-api-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/surf_spots_db
      SPRING_DATASOURCE_USERNAME: postgres
      # App reads spring.datasource.password from ${DB_PASSWORD} in application.yml
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      # When MAIL_ENABLED=true, send to Mailpit from inside Docker (override host defaults in application-dev.yml).
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      # Run tests against a dedicated DB (postgres), not surf_spots_db.
      SPRING_TEST_DATASOURCE_URL: ${SPRING_TEST_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/surf_spots_test_db}
      SPRING_TEST_DATASOURCE_USERNAME: ${SPRING_TEST_DATASOURCE_USERNAME:-postgres}
      SPRING_TEST_DATASOURCE_PASSWORD: ${SPRING_TEST_DATASOURCE_PASSWORD:-${DB_PASSWORD:-postgres}}
      # Scaleway Object Storage (media upload) - set in shell or .env
      SCW_ACCESS_KEY: ${SCW_ACCESS_KEY:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-surf-spots-media}
      SCW_ENDPOINT: ${SCW_ENDPOINT:-https://s3.fr-par.scw.cloud}
      SCW_REGION: ${SCW_REGION:-fr-par}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      # Test configuration - tests will use these when running in Docker
      # When running tests, Spring will use the 'test' profile and these env vars
    ports:
      - "8080:8080"
    volumes:
      # Mount source only. /app/target is NOT mounted — it is built inside the
      # container. Dockerfile.dev deletes target/.../db/migration before each
      # start so removed Flyway scripts cannot linger and collide by version.
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./scripts/contest-import/snapshots:/app/scripts/contest-import/snapshots:ro
      # Cache Maven dependencies
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - surf-spots-network
    # Keep container running even if build fails initially
    restart: unless-stopped

  # Dedicated test runner: do not use `mvn test` in the `api` service (it inherits the dev DB URL).
  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_TEST_DATASOURCE_URL: jdbc:postgresql://postgres:5432/surf_spots_test_db
      SPRING_TEST_DATASOURCE_USERNAME: postgres
      SPRING_TEST_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./mvnw:/app/mvnw
      - ./mvnw.cmd:/app/mvnw.cmd
      - ./.mvn:/app/.mvn
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - surf-spots-network
    command: ["./mvnw", "test"]

volumes:
  postgres_data_dev:
  maven_cache:

networks:
  surf-spots-network:
    driver: bridge

