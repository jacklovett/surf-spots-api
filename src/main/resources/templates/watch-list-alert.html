<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta name="color-scheme" content="light only">
    <title>Watch list alert</title>
    <th:block th:insert="~{email/fragments :: inter}"></th:block>
</head>
<body style="margin:0;padding:0;background-color:#eef2f7;">
<div style="display:none;max-height:0;overflow:hidden;" th:text="${alertTitle}">Watch list alert</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#eef2f7;">
    <tr>
        <td align="center" style="padding:32px 14px 48px 14px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                   style="max-width:560px;border-collapse:separate;border-spacing:0;border-radius:20px;overflow:hidden;
                          box-shadow:0 20px 50px rgba(13,22,25,0.12);">
                <tr>
                    <td th:insert="~{email/fragments :: masthead}"></td>
                </tr>
                <tr>
                    <td style="background-color:#ffffff;border:1px solid #dddddd;border-top:none;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td style="padding:40px 30px 44px 30px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#0d1619;">
                                    <p style="margin:0 0 10px 0;font-size:12px;font-weight:700;letter-spacing:0.02em;color:#666666;" th:text="${alertTypeLabel}">Swell season</p>
                                    <h1 style="margin:0 0 20px 0;font-size:28px;line-height:1.35;font-weight:700;letter-spacing:0;color:#333333;" th:text="${alertTitle}">Season starting</h1>
                                    <p style="margin:0 0 28px 0;font-size:16px;line-height:1.7;letter-spacing:0.02em;color:#666666;" th:text="${alertDescription}">
                                        Concrete detail about which watched spots are affected and what to do next.
                                    </p>

                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                           style="margin:0 0 28px 0;border-collapse:collapse;"
                                           th:if="${alertLocation != null or alertDateRange != null or alertSpotName != null}">
                                        <tr th:if="${alertLocation}">
                                            <td style="padding:16px 0 12px 0;border-top:1px solid #dddddd;font-size:12px;font-weight:600;letter-spacing:0.02em;color:#666666;width:110px;vertical-align:top;">Where</td>
                                            <td style="padding:16px 0 12px 0;border-top:1px solid #dddddd;font-size:16px;line-height:1.55;color:#0d1619;font-weight:600;" th:text="${alertLocation}">Donegal, Ireland</td>
                                        </tr>
                                        <tr th:if="${alertDateRange}">
                                            <td style="padding:16px 0 12px 0;border-top:1px solid #dddddd;font-size:12px;font-weight:600;letter-spacing:0.02em;color:#666666;width:110px;vertical-align:top;">Dates</td>
                                            <td style="padding:16px 0 12px 0;border-top:1px solid #dddddd;font-size:16px;line-height:1.55;color:#0d1619;font-weight:600;" th:text="${alertDateRange}">Oct to Mar</td>
                                        </tr>
                                        <tr th:if="${alertSpotName}">
                                            <td style="padding:16px 0 12px 0;border-top:1px solid #dddddd;font-size:12px;font-weight:600;letter-spacing:0.02em;color:#666666;width:110px;vertical-align:top;">Spot</td>
                                            <td style="padding:16px 0 12px 0;border-top:1px solid #dddddd;font-size:16px;line-height:1.55;color:#0d1619;font-weight:600;" th:text="${alertSpotName}">Bundoran Peak</td>
                                        </tr>
                                    </table>

                                    <table th:if="${alertLink}" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 32px 0;">
                                        <tr>
                                            <td>
                                                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                                    <tr>
                                                        <td style="border-radius:12px;background-color:#035061;border:1px solid #023d4d;">
                                                            <a th:href="${alertLink}" target="_blank" rel="noopener noreferrer"
                                                               style="display:inline-block;padding:14px 32px;font-size:16px;font-weight:600;letter-spacing:0.01em;text-transform:none;line-height:1.25;color:#ffffff;text-decoration:none;"
                                                               th:text="${alertCtaLabel}">View watch list</a>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>

                                    <p style="margin:0;font-size:16px;line-height:1.6;letter-spacing:0.02em;color:#0d1619;">
                                        Thanks,<br/>
                                        <span style="font-weight:600;color:#0d1619;">The Surf Spots team</span>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
            <div th:insert="~{email/fragments :: footer}"></div>
        </td>
    </tr>
</table>
</body>
</html>
