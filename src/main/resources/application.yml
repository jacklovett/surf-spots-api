spring:
  profiles:
    # default (not active): Surefire sets spring.profiles.active=test; "active: dev" here
    # merges with that in some setups so both dev+test run and JDBC/seeding misbehave.
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/surf_spots_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: public
        # Batch-load lazy associations / ElementCollections (list endpoints touch many spots)
        default_batch_fetch_size: 25
    show-sql: false  # Set to true or use logging.level.org.hibernate.SQL: DEBUG in dev to inspect SQL
  cache:
    type: simple
    cache-names:
      - regionLookup
  mail:
    host: smtp.scaleway.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
server:
  max-http-header-size: 16KB
  max-http-post-size: 50MB

# Full exception stack traces for WARN/ERROR (so logs show what actually broke)
logging:
  level:
    com.lovettj.surfspotsapi: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %logger{36} - %msg%n%rEx"

# Trusted browser origins (CORS, CSRF Origin filter, password-reset / email link trust).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://surf-spots-five.vercel.app}

# App-specific settings
app:
  auth:
    session-secret: ${SESSION_SECRET:}
  # Public web app origin (trip emails, invite links). No trailing slash.
  url: ${APP_URL:http://localhost:5173}
  # Browser-reachable API base for email action links (GET verify-email redirect). No trailing slash.
  public-api-base-url: ${APP_PUBLIC_API_URL:http://localhost:8080}
  email:
    # Full URL to masthead image (same asset as home hero: public/images/png/logo.png). Default: {app.url}/images/png/logo.png
    # Dev profile sets this to the API static copy so mail preview works without the frontend.
    logo-url: ${APP_EMAIL_LOGO_URL:}
  mapbox:
    access-token: ${MAPBOX_ACCESS_TOKEN:}
  live-session:
    overdue-notification-enabled: ${LIVE_SESSION_OVERDUE_NOTIFICATION_ENABLED:true}
    overdue-notification-check-ms: ${LIVE_SESSION_OVERDUE_NOTIFICATION_CHECK_MS:300000}
  # Environmental alerts for watched spots (off by default).
  environmental-alerts:
    enabled: ${ENVIRONMENTAL_ALERTS_ENABLED:false}
    sync-cron: ${ENVIRONMENTAL_ALERTS_SYNC_CRON:0 */30 * * * *}
    http:
      connect-timeout: 5s
      read-timeout: 60s
    # Provider blocks bind next to each provider. Add a new country = new @Component + properties.
    uk:
      enabled: true
      provider-key: uk-overflow
      country-slugs:
        - united-kingdom
      nation-region-slugs:
        - england
        - scotland
        - wales
        - northern-ireland
      # Shared for Scottish Water + all ArcGIS company feeds (change once).
      match-radius-metres: 3000
      feed-cache-ttl: 5m
      scottish-water:
        enabled: true
        api-url: https://api.scottishwater.co.uk/overflow-event-monitoring/v1/near-real-time
        source-name: Scottish Water
        source-url: https://www.scottishwater.co.uk/Your-Home/Your-Waste-Water/Overflows/Live-Overflow-Map
      stream-companies:
        - id: southwest-water
          enabled: true
          nation-region-slug: england
          query-url: https://services-eu1.arcgis.com/OMdMOtfhATJPcHe3/arcgis/rest/services/NEH_outlets_PROD/FeatureServer/0/query
          source-name: South West Water
          source-url: https://www.southwestwater.co.uk/storm-overflow-map
          field-style: southwest
        - id: southern-water
          enabled: true
          nation-region-slug: england
          query-url: https://services-eu1.arcgis.com/6qJmARkS2dt2IjVA/arcgis/rest/services/SouthernWater_StormOverflowActivity_PROD_view/FeatureServer/0/query
          source-name: Southern Water
          source-url: https://www.southernwater.co.uk/our-region/clean-rivers-and-seas-task-force/rivers-and-seas-watch/
          field-style: southern
        - id: welsh-water
          enabled: true
          nation-region-slug: wales
          query-url: https://services3.arcgis.com/KLNF7YxtENPLYVey/arcgis/rest/services/Spill_Prod/FeatureServer/0/query
          source-name: Welsh Water
          source-url: https://corporate.dwrcymru.com/en/community/environment/storm-overflow-map
          field-style: welsh-water
  mail:
    enabled: ${MAIL_ENABLED:true} # Set to false to disable email sending
    # Optional From header; use an address verified with your SMTP provider (e.g. Scaleway).
    from: ${MAIL_FROM:}
    # Inbox for contact form submissions
    contact-to: ${MAIL_CONTACT_TO:hello@surfspots.com}
  storage:
    s3:
      endpoint: ${SCW_ENDPOINT:https://s3.fr-par.scw.cloud}
      region: ${SCW_REGION:fr-par}
      bucket: ${S3_BUCKET:surf-spots-media}
      access-key: ${SCW_ACCESS_KEY:}
      secret-key: ${SCW_SECRET_KEY:}